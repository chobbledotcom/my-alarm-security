media:
  input: images
  output: /images
  path: images
  rename: safe
  categories:
    - image
settings:
  hide: true
  content:
    merge: true
content:
  - name: pages
    label: Pages
    path: pages
    type: collection
    subfolders: false
    filename: "{primary}.md"
    view:
      fields:
        - name
        - permalink
        - meta_title
      primary: name
      sort:
        - meta_title
    fields:
      - { name: name, type: string, label: Name }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, options: { maxlength: 55 } }
      - name: meta_description
        type: string
        label: Meta Description
        options: { maxlength: 155 }
      - name: og_title
        type: string
        label: Share Title
        options: { maxlength: 70 }
        description: Title shown when this page is shared on Facebook, WhatsApp, email and other apps. Leave blank to use the page title.
      - name: og_description
        type: string
        label: Share Text
        options: { maxlength: 155 }
        description: Text shown when this page is shared on Facebook, WhatsApp and other apps. Leave blank to use the Meta Description.
      - name: eleventyNavigation
        label: Navigation
        type: object
        fields:
          - { name: key, type: string }
          - { name: order, type: number }
      - { name: layout, type: string }
      - { name: permalink, type: string, label: Permalink }
      - { name: no_index, type: boolean, label: Hide from search engines }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: products
    label: Products
    path: products
    type: collection
    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: thumbnail, type: image, label: Thumbnail }
      - { name: price, type: string, label: Price}
      - { name: order, type: number, label: Order }
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - name: options
        label: Product Options
        type: object
        list: true
        fields:
          - { name: name, type: string, label: Option Name, required: true }
          - name: max_quantity
            type: number
            label: Max Quantity
            default: 10
          - name: unit_price
            type: number
            label: Unit Price (£)
            required: true
          - { name: days, type: number, label: Days (for hire products) }
      - { name: features, type: string, label: Features, list: true }
      - name: filter_attributes
        label: Filter Attributes
        type: object
        list: true
        fields:
          - { name: name, type: string, label: Name, required: true }
          - { name: value, type: string, label: Value, required: true }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, options: { maxlength: 55 } }
      - name: meta_description
        type: string
        label: Meta Description
        options: { maxlength: 155 }
      - name: og_title
        type: string
        label: Share Title
        options: { maxlength: 70 }
        description: Title shown when this page is shared on Facebook, WhatsApp, email and other apps. Leave blank to use the page title.
      - name: og_description
        type: string
        label: Share Text
        options: { maxlength: 155 }
        description: Text shown when this page is shared on Facebook, WhatsApp and other apps. Leave blank to use the Meta Description.
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
      - name: specs
        label: Specifications
        type: object
        list: true
        fields:
          - { name: name, type: string, label: Name, required: true }
          - { name: value, type: string, label: Value, required: true }
      - name: tabs
        label: Tabs
        type: object
        list: true
        fields:
          - { name: title, type: string, label: Title, required: true }
          - { name: image, type: image, label: Image }
          - { name: body, type: rich-text, label: Body, required: true }
      - { name: redirect_from, type: string, label: Redirect From, list: true }
  - name: categories
    label: Categories
    path: categories
    type: collection
    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: thumbnail, type: image, label: Thumbnail }
      - name: parent
        label: Parent Category
        type: reference
        options:
          collection: categories
          multiple: false
          search: title
          value: "{path}"
          label: "{title}"
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, options: { maxlength: 55 } }
      - name: meta_description
        type: string
        label: Meta Description
        options: { maxlength: 155 }
      - name: og_title
        type: string
        label: Share Title
        options: { maxlength: 70 }
        description: Title shown when this page is shared on Facebook, WhatsApp, email and other apps. Leave blank to use the page title.
      - name: og_description
        type: string
        label: Share Text
        options: { maxlength: 155 }
        description: Text shown when this page is shared on Facebook, WhatsApp and other apps. Leave blank to use the Meta Description.
      - { name: subtitle, type: string, label: Subtitle }
      - { name: featured, type: boolean, label: Show on homepage }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: news
    label: News
    path: news
    type: collection
    subfolders: false
    fields:
      - { name: title, type: string, label: Title }
      - { name: date, label: Date, type: date }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, options: { maxlength: 55 } }
      - name: meta_description
        type: string
        label: Meta Description
        options: { maxlength: 155 }
      - name: og_title
        type: string
        label: Share Title
        options: { maxlength: 70 }
        description: Title shown when this page is shared on Facebook, WhatsApp, email and other apps. Leave blank to use the page title.
      - name: og_description
        type: string
        label: Share Text
        options: { maxlength: 155 }
        description: Text shown when this page is shared on Facebook, WhatsApp and other apps. Leave blank to use the Meta Description.
      - { name: permalink, type: string, label: Permalink }
      - { name: no_index, type: boolean, label: Hide from search engines }
      - { name: redirect_from, type: string, label: Redirect From, list: true }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: reviews
    label: Reviews
    path: reviews
    type: collection
    subfolders: false
    fields:
      - { name: name, type: string, label: Name }
      - { name: url, type: string, label: URL }
      - { name: rating, type: number, label: Rating }
      - { name: thumbnail, type: image, label: Reviewer Photo }
      - { name: body, type: rich-text, label: Body }
      - { name: date, label: Date, type: date }
      - name: products
        label: Products
        type: reference
        options:
          collection: products
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
  - name: locations
    label: Locations
    path: locations
    type: collection
    subfolders: true
    filename: "{primary}.md"
    view:
      fields:
        - thumbnail
        - title
        - subtitle
      primary: title
      sort:
        - title
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: thumbnail, type: image, label: Thumbnail }
      - name: hero_image
        type: image
        label: Top Photo
        description: Photo shown beside the heading at the top of the page. A 4:3 landscape photo works best.
      - name: hero_alt
        type: string
        label: Top Photo Description
        description: Describes the top photo for people who can't see it.
      - name: hero_lead
        type: text
        label: Top Text
        description: The sentence shown under the heading at the top of the page. Leave blank to use the Share Text.
      - name: hero_points
        type: string
        label: Top Bullet Points
        list: true
        description: Short points shown under the buttons at the top of the page. Leave empty to use the default points.
      - name: work
        label: Recent Work Photos
        description: Photos of jobs in this area, shown under the heading. Leave empty to show our latest jobs instead.
        type: object
        list: true
        fields:
          - { name: image, type: image, label: Photo, required: true }
          - { name: title, type: string, label: Title, required: true }
          - { name: url, type: string, label: Link to the news post }
      - { name: permalink, type: string, label: Permalink }
      - { name: order, type: number, label: Order }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, options: { maxlength: 55 } }
      - name: meta_description
        type: string
        label: Meta Description
        options: { maxlength: 155 }
      - name: og_title
        type: string
        label: Share Title
        options: { maxlength: 70 }
        description: Title shown when this page is shared on Facebook, WhatsApp, email and other apps. Leave blank to use the page title.
      - name: og_description
        type: string
        label: Share Text
        options: { maxlength: 155 }
        description: Text shown when this page is shared on Facebook, WhatsApp and other apps. Leave blank to use the Meta Description.
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: rich-text, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: homepage
    label: Homepage Settings
    type: file
    path: _data/homepage.json
    fields:
      - name: show_news
        type: boolean
        label: Show Latest News
        default: true
  - name: homepage-content
    label: Homepage Content
    type: file
    path: _data/home_content.json
    fields:
      - name: banner
        label: Top Banner
        type: object
        fields:
          - name: special_offer
            label: Special Offer
            type: object
            fields:
              - { name: message, type: string, label: Offer Text }
              - { name: link, type: string, label: Offer Link }
          - name: images
            label: Banner Photos
            type: image
            options:
              multiple: true
          - name: alts
            label: Banner Photo Descriptions
            type: string
            list: true
            description: One description per photo, in the same order as the photos above.
      - name: hero
        label: Service Cards
        type: object
        fields:
          - name: service_cards
            label: Cards
            type: object
            list: true
            fields:
              - { name: title, type: string, label: Title, required: true }
              - { name: description, type: text, label: Description, required: true }
              - { name: link, type: string, label: Link }
              - { name: image, type: image, label: Photo }
      - name: why_choose_us
        label: Why Choose Us
        type: object
        fields:
          - { name: heading, type: string, label: Heading }
          - name: features
            label: Features
            type: object
            list: true
            fields:
              - { name: title, type: string, label: Title, required: true }
              - { name: icon, type: string, label: Icon Path, required: true }
      - name: reviews
        label: Reviews Section
        type: object
        fields:
          - { name: heading, type: string, label: Heading }
  - name: brands
    label: Brands
    type: file
    path: _data/brands.json
    fields:
      - name: icons
        label: Brand Logos
        type: object
        list: true
        fields:
          - name: filename
            type: string
            label: File Name
            required: true
            description: File in images/Brands, for example logo-pyronix.png
          - { name: alt_text, type: string, label: Brand Name, required: true }
  - name: site
    label: Site Configuration
    type: file
    path: _data/site.json
    fields:
      - { name: name, type: string, label: Site Name }
      - { name: url, type: string, label: Site URL }
      - name: opening_times
        label: Opening Times
        type: object
        list: true
        fields:
          - { name: day, type: string, label: Day, required: true }
          - { name: hours, type: string, label: Hours, required: true }
      - name: socials
        label: Social Media Links
        type: object
        fields:
          - { name: Github, type: string, label: Github }
          - { name: Forgejo, type: string, label: Forgejo }
          - { name: Facebook, type: string, label: Facebook }
          - { name: Instagram, type: string, label: Instagram }
          - { name: TikTok, type: string, label: TikTok }
          - { name: Google, type: string, label: Google }
          - { name: WhatsApp, type: string, label: WhatsApp }
          - { name: RSS, type: string, label: RSS }
  - name: meta
    label: Meta Configuration
    type: file
    path: _data/meta.json
    fields:
      - { name: language, type: string, label: Language Code, default: en-GB }
      - name: organization
        label: Organization
        type: object
        fields:
          - { name: description, type: string, label: Organization Description }
          - { name: legalName, type: string, label: Legal Name }
          - { name: foundingDate, type: string, label: Founding Date }
          - name: founders
            label: Founders
            type: object
            list: true
            fields:
              - { name: name, type: string, label: Name }
          - name: address
            label: Address
            type: object
            fields:
              - { name: streetAddress, type: string, label: Street Address }
              - { name: addressLocality, type: string, label: City }
              - { name: addressRegion, type: string, label: Region/State }
              - { name: postalCode, type: string, label: Postal Code }
              - { name: addressCountry, type: string, label: Country Code }
          - name: contactPoint
            label: Contact Points
            type: object
            list: true
            fields:
              - { name: telephone, type: string, label: Telephone }
              - { name: contactType, type: string, label: Contact Type }
              - { name: areaServed, type: string, label: Area Served }
              - name: availableLanguage
                type: string
                label: Available Languages
                list: true
  - name: alt-tags
    label: Image Alt Tags
    type: file
    path: _data/alt-tags.json
    fields:
      - name: images
        type: object
        list: true
        fields:
          - { name: path, type: image, label: Image }
          - { name: alt, type: string, label: Alt Text }
