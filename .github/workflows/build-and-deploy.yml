name: Build and Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      repair_images:
        description: "Re-upload every generated image to the storage zone (heals replicas that missed files)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Merge Repos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout Chobble Template
        uses: actions/checkout@v7
        with:
          repository: chobble-mirror/chobble-template
          ref: 4ffc3ca9d4ff2bbea9594ccf87909956bb49c831
          path: template
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .eleventy.js
            package.json
            bun.lock
            bunfig.toml
            flake.nix
            flake.lock
            bin
            packages
            src

      - name: Copy template files to combined dir
        run: |
          mkdir -p combined
          rsync \
            --recursive \
            --verbose \
            --delete \
            --exclude=".git" \
            --exclude="*.md" \
            --exclude="images" \
            --exclude="landing-pages/*.html" \
            template/ \
            combined/

      - name: Overlay our repo files into combined src
        run: |
          rsync \
            --recursive \
            --verbose \
            --exclude=".*" \
            --exclude="README.md" \
            --exclude="package.json" \
            --exclude="bun.lock" \
            source/ \
            combined/src/

      - name: Update site.json with secrets
        run: |
          sed -i \
            's/"formspark_id": null/"formspark_id": "${{ secrets.FORMSPARK_ID }}"/g' \
            "combined/src/_data/config.json"
          sed -i \
            's/"botpoison_public_key": null/"botpoison_public_key": "${{ secrets.BOTPOISON_PUBLIC_KEY }}"/g' \
            "combined/src/_data/config.json"

      - name: Upload combined directory
        uses: actions/upload-artifact@v7
        with:
          name: combined-files
          path: combined/
          retention-days: 1
          include-hidden-files: true

  build:
    name: Build Site
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Download combined directory
        uses: actions/download-artifact@v8
        with:
          name: combined-files
          path: combined

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            combined/node_modules
            combined/.image-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('combined/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build with Bun
        run: |
          cd combined
          bun install --frozen-lockfile
          bun --bun run eleventy
          mkdir -p ../_site
          mv _site/* ../_site/

      - name: Set deployment environment
        id: deployment_env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "storage_zone_name=${{ secrets.BUNNY_PRODUCTION_STORAGE_ZONE_NAME }}" >> $GITHUB_OUTPUT
            echo "storage_zone_password=${{ secrets.BUNNY_PRODUCTION_STORAGE_ZONE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "pull_zone_id_deploy=${{ secrets.BUNNY_PRODUCTION_PULL_ZONE_ID }}" >> $GITHUB_OUTPUT
          else
            echo "storage_zone_name=${{ secrets.BUNNY_STAGING_STORAGE_ZONE_NAME }}" >> $GITHUB_OUTPUT
            echo "storage_zone_password=${{ secrets.BUNNY_STAGING_STORAGE_ZONE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "pull_zone_id_deploy=${{ secrets.BUNNY_STAGING_PULL_ZONE_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Repair image replicas
        if: inputs.repair_images == true
        env:
          STORAGE_ZONE: ${{ steps.deployment_env.outputs.storage_zone_name }}
          STORAGE_PASSWORD: ${{ steps.deployment_env.outputs.storage_zone_password }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          zone = os.environ["STORAGE_ZONE"]
          password = os.environ["STORAGE_PASSWORD"]
          root = "_site"
          files = [
              os.path.join(directory, name)
              for directory, _, names in os.walk(os.path.join(root, "img"))
              for name in names
          ]

          def upload(path):
              relative = os.path.relpath(path, root).replace(os.sep, "/")
              url = (
                  "https://storage.bunnycdn.com/"
                  + zone
                  + "/"
                  + urllib.parse.quote(relative)
              )
              with open(path, "rb") as source:
                  request = urllib.request.Request(
                      url,
                      data=source.read(),
                      method="PUT",
                      headers={"AccessKey": password},
                  )
              with urllib.request.urlopen(request, timeout=120) as response:
                  response.read()

          with ThreadPoolExecutor(max_workers=10) as pool:
              list(pool.map(upload, files))

          print(f"Re-uploaded {len(files)} images")
          PY

      - name: Purge Rewrite Zone
        uses: R-J-dev/bunny-deploy@v3.0.0
        with:
          access-key: ${{ secrets.BUNNY_ACCESS_KEY }}
          directory-to-upload: _site
          storage-endpoint: "https://storage.bunnycdn.com"
          storage-zone-name: ${{ steps.deployment_env.outputs.storage_zone_name }}
          storage-zone-password: ${{ steps.deployment_env.outputs.storage_zone_password }}
          concurrency: "5"
          enable-delete-action: true
          enable-purge-pull-zone: true
          pull-zone-id: ${{ secrets.BUNNY_REWRITE_PULL_ZONE_ID }}
          replication-timeout: "15000"

      - name: Deploy to Bunny
        uses: R-J-dev/bunny-deploy@v3.0.0
        with:
          access-key: ${{ secrets.BUNNY_ACCESS_KEY }}
          directory-to-upload: _site
          storage-endpoint: "https://storage.bunnycdn.com"
          storage-zone-name: ${{ steps.deployment_env.outputs.storage_zone_name }}
          storage-zone-password: ${{ steps.deployment_env.outputs.storage_zone_password }}
          concurrency: "5"
          enable-delete-action: true
          enable-purge-pull-zone: true
          pull-zone-id: ${{ steps.deployment_env.outputs.pull_zone_id_deploy }}
          replication-timeout: "15000"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-24.04
    needs: [setup, build]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}
